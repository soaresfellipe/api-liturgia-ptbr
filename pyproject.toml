[project]
name = "api-liturgia-diaria"
version = "1.0.0"
description = "API Flask das leituras litúrgicas diárias (fonte: Canção Nova)"
requires-python = ">=3.12"
# Espelha requirements.txt (usado pela Vercel); mantenha os pins em sincronia.
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
    "beautifulsoup4==4.15.0",
    "soupsieve==3.0.3",
    "requests==2.34.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app.py", "extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --cov=app --cov=extractor --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: testes que batem na fonte real da Canção Nova (excluídos por padrão)",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.deptry]
known_first_party = ["extractor"]

[tool.deptry.per_rule_ignores]
# Werkzeug é dependência transitiva do Flask, fixada explicitamente por compatibilidade;
# soupsieve é dependência do beautifulsoup4.
DEP002 = ["Werkzeug", "soupsieve"]

[tool.vulture]
paths = ["app.py", "extractor"]
min_confidence = 80

name: Solicitação de funcionalidade
description: Sugira uma melhoria ou nova funcionalidade
labels: ["feature"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve?
      description: Descreva o caso de uso (ex.: aplicações de evangelização que consomem a API).
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: O que você sugere? Como deveria funcionar?
    validations:
      required: true

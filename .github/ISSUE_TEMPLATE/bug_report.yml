name: Relatório de bug
description: Reporte um problema na API
labels: ["bug"]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descrição clara do problema, incluindo o que era esperado.
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. curl https://api-liturgia-diaria.vercel.app/
        2. Erro observado: ...
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Data/hora da requisição, logs, print da resposta.
